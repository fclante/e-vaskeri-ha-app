<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Vaskeri card · dev harness</title>
    <style>
      :root {
        font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      .stage {
        /* A close imitation of the default Home Assistant themes. */
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --divider-color: #e0e0e0;
        --card-background-color: #ffffff;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 1px 5px 0 rgba(0, 0, 0, 0.12), 0 3px 1px -2px rgba(0, 0, 0, 0.2);
        background: #fafafa;
        color: var(--primary-text-color);
        min-height: 100vh;
        display: grid;
        grid-template-columns: 300px 1fr;
      }
      .stage.dark {
        --primary-color: #03a9f4;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --ha-card-box-shadow: none;
        background: #111111;
        color-scheme: dark;
      }
      .stage.nopanel {
        grid-template-columns: 1fr;
      }
      .stage.nopanel aside {
        display: none;
      }
      aside {
        padding: 16px;
        border-right: 1px solid var(--divider-color);
        font-size: 13px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        box-sizing: border-box;
      }
      aside h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      aside h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--secondary-text-color);
        margin: 16px 0 6px;
      }
      aside label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      aside button,
      aside select {
        font: inherit;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      main {
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      #frame {
        width: 720px;
        max-width: 100%;
      }
      ha-card {
        display: block;
        background: var(--card-background-color);
        border-radius: var(--ha-card-border-radius);
        box-shadow: var(--ha-card-box-shadow);
        border: 1px solid var(--divider-color);
        color: var(--primary-text-color);
      }
      #log {
        margin-top: 12px;
        font: 11px/1.4 ui-monospace, monospace;
        color: var(--secondary-text-color);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <aside id="panel"></aside>
      <main><div id="frame"><div id="mount"></div><div id="log"></div></div></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
